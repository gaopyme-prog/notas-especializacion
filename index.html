<style>
:root{--bg:#F2F5F9;--card:#fff;--ink:#142033;--muted:#566478;--line:#D6DDE7;--accent:#1D4F91;--on:#fff;--bad:#B3261E;--badsoft:#FBE6E4;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0E1520;--card:#172131;--ink:#E7EDF6;--muted:#9AA9BE;--line:#2A3A52;--accent:#8DB8F2;--on:#0B1624;--bad:#F19A94;--badsoft:#3B1715;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:28px 16px 56px}
main{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.eyebrow{margin:0;font:600 .75rem/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{margin:6px 0 0;font-size:1.75rem;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted)}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px}
label{font-weight:600;font-size:.95rem}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:12px;width:100%;font-variant-numeric:tabular-nums}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{margin-top:8px;font:inherit;font-weight:700;background:var(--accent);color:var(--on);border:0;border-radius:9px;padding:13px;cursor:pointer}
button:disabled{opacity:.6}
#out{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.who{margin:0 0 12px;font-weight:600;overflow-wrap:anywhere}
.hero{background:var(--accent);color:var(--on);border-radius:12px;padding:16px 18px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.hero span{font-weight:600}
.hero b{font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.item{padding:11px 2px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.line{display:flex;justify-content:space-between;gap:12px}
.line span{color:var(--muted)}
.line b{font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere}
.why{margin:6px 0 0;font-size:.95rem;line-height:1.5;overflow-wrap:anywhere}
.herowhy{margin:10px 2px 4px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
summary{cursor:pointer;font-weight:600}
summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#how p{margin:10px 0 0;color:var(--muted);font-size:.95rem;line-height:1.5}
.err{margin:0;background:var(--badsoft);color:var(--bad);border-radius:10px;padding:12px 14px}
.note{margin:0;color:var(--muted);font-size:.95rem}
footer{color:var(--muted);font-size:.85rem}
</style>
<main>
  <header>
    <p class="eyebrow">Consulta de notas</p>
    <h1 id="t"></h1>
    <p class="sub" id="sub"></p>
  </header>
  <form id="f" autocomplete="off">
    <label for="ced">Número de cédula</label>
    <input id="ced" type="text" inputmode="numeric" placeholder="Sin puntos ni espacios">
    <div id="kbox" hidden="">
      <label for="clave">Clave del curso</label>
      <input id="clave" type="password" autocomplete="off">
    </div>
    <button id="go" type="submit">Consultar</button>
  </form>
  <section id="out" aria-live="polite" hidden=""></section>
  <details id="howbox" hidden=""><summary>Cómo se calificó</summary><div id="how"></div></details>
  <p class="note" id="note"></p>
  <footer id="foot"></footer>
</main>

<script>
var enc=new TextEncoder();
function cleanCed(v){ return String(v == null ? '' : v).replace(/\D/g, '').replace(/^0+/, ''); }
function b64ToBytes(s){ const bin = atob(s); const b = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i); return b; }
function bytesToHex(b){ return Array.from(b, function(x){ return x.toString(16).padStart(2, '0'); }).join(''); }
async function derive(ced, clave, saltB64, iter){
  const pass = enc.encode(cleanCed(ced) + '|' + String(clave || '').trim().toLowerCase());
  const km = await crypto.subtle.importKey('raw', pass, 'PBKDF2', false, ['deriveBits']);
  const master = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64ToBytes(saltB64), iterations: iter }, km, 256));
  const a = new Uint8Array(33); a[0] = 105; a.set(master, 1);
  const k = new Uint8Array(33); k[0] = 107; k.set(master, 1);
  const idH = new Uint8Array(await crypto.subtle.digest('SHA-256', a));
  const kH = new Uint8Array(await crypto.subtle.digest('SHA-256', k));
  const key = await crypto.subtle.importKey('raw', kH, 'AES-GCM', false, ['encrypt', 'decrypt']);
  return { id: bytesToHex(idH.slice(0, 16)), key: key };
}
async function consultar(pack, ced, clave){
  if (!cleanCed(ced)) return null;
  const dk = await derive(ced, clave, pack.salt, pack.iter);
  const rec = pack.r.find(function(x){ return x.i === dk.id; });
  if (!rec) return null;
  try {
    const raw = b64ToBytes(rec.d);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, dk.key, raw.slice(12));
    return JSON.parse(new TextDecoder().decode(pt));
  } catch (e) { return null; }
}
(function(){
  var pack=JSON.parse(document.getElementById('pack').textContent);
  var $=function(i){return document.getElementById(i)};
  $('t').textContent=pack.title||'Consulta de notas';
  if(pack.sub){$('sub').textContent=pack.sub}else{$('sub').hidden=true}
  if(pack.note){$('note').textContent=pack.note}else{$('note').hidden=true}
  var foot=[];
  if(pack.doc)foot.push('Docente: '+pack.doc);
  if(pack.date)foot.push('Notas al '+pack.date);
  $('foot').textContent=foot.join(' · ');
  if(pack.k)$('kbox').hidden=false;
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
  if(pack.how){
    pack.how.split(/\n+/).forEach(function(t){if(t.trim())$('how').appendChild(el('p','',t.trim()))});
    $('howbox').hidden=false;
  }
  function row(label,val,why){
    var it=el('div','item');var l=el('div','line');
    l.appendChild(el('span','',label));l.appendChild(el('b','',val));it.appendChild(l);
    if(why)it.appendChild(el('p','why',why));
    return it;
  }
  function show(d,msg){
    var out=$('out');out.textContent='';out.hidden=false;
    if(!d){out.appendChild(el('p','err',msg));return}
    if(d.n)out.appendChild(el('p','who',d.n));
    if(pack.hi>=0&&pack.cols[pack.hi]!==undefined){
      var h=el('div','hero');h.appendChild(el('span','',pack.cols[pack.hi]));h.appendChild(el('b','',d.v[pack.hi]));out.appendChild(h);
      if(d.c&&d.c[pack.hi])out.appendChild(el('p','why herowhy',d.c[pack.hi]));
    }
    pack.cols.forEach(function(c,i){
      if(i===pack.hi)return;
      out.appendChild(row(c,d.v[i],d.c&&d.c[i]));
    });
    (d.x||[]).forEach(function(r){out.appendChild(row(r[0],r[1],r[2]))});
  }
  $('f').addEventListener('submit',async function(e){
    e.preventDefault();
    var go=$('go');
    if(!cleanCed($('ced').value)){show(null,'Escribe tu número de cédula.');return}
    if(!(window.crypto&&window.crypto.subtle)){show(null,'Este navegador no puede abrir la consulta. Entra desde el enlace https que te dio tu docente.');return}
    go.disabled=true;go.textContent='Buscando…';
    try{
      var d=await consultar(pack,$('ced').value,$('clave').value);
      show(d,pack.k?'No encontramos esa cédula con esa clave. Revisa los dos datos e inténtalo de nuevo.':'No encontramos esa cédula. Escríbela sin puntos ni espacios. Si sigue sin aparecer, consúltalo con tu docente.');
    }catch(err){show(null,'Ocurrió un error al consultar. Inténtalo de nuevo.')}
    go.disabled=false;go.textContent='Consultar';
  });
})();
